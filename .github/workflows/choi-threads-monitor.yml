name: CHOI Threads Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - ".github/workflows/choi-threads-monitor.yml"
      - "choi_threads_monitor/collect.py"

permissions:
  contents: write

concurrency:
  group: choi-threads-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install threads-cli
        run: go install github.com/tamnd/threads-cli/cmd/th@latest

      - name: Collect @choi.openai
        run: python3 choi_threads_monitor/collect.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add choi_threads_monitor/data/choi_latest.json
          if git diff --cached --quiet; then
            echo "No snapshot change."
            exit 0
          fi
          git commit -m "chore: update choi.openai Threads snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
