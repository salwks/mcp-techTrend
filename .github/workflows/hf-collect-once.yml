name: Hugging Face Daily Papers one-time recovery

on:
  push:
    paths:
      - ".github/workflows/hf-collect-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huggingface-daily-papers
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect only today's Hugging Face Daily Papers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 choi_threads_monitor/collect_research.py
          git add -- choi_threads_monitor/data/hf_daily_today.json choi_threads_monitor/data/hf_daily_today.md
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "chore: refresh standalone Hugging Face Daily Papers"
          git push origin HEAD:main
