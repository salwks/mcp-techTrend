name: Hugging Face Daily Papers One-Time Recovery 2026-11-09

on:
  push:
    paths:
      - ".github/workflows/hf-collect-once.yml"

permissions:
  contents: write

concurrency:
  group: huggingface-daily-papers
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Hugging Face Daily Papers for current KST date only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if python3 choi_threads_monitor/collect_research.py; then
              git add -- choi_threads_monitor/data/hf_daily_today.json choi_threads_monitor/data/hf_daily_today.md choi_threads_monitor/data/hf_daily_archive
              if git diff --cached --quiet; then
                echo "No Hugging Face changes"
                exit 0
              fi
              git commit -m "chore: recover 2026-11-09 Hugging Face Daily Papers only"
              if git push origin HEAD:main; then
                echo "HF-only snapshot pushed"
                exit 0
              fi
            fi
            echo "Retrying HF-only collection" >&2
            sleep 12
          done
          exit 1
