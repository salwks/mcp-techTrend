name: Hugging Face Daily Papers Collector

on:
  workflow_dispatch:
  schedule:
    # 12:00 KST (03:00 UTC), exactly once a day
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: huggingface-daily-papers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect Hugging Face Daily Papers only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 choi_threads_monitor/collect_research.py
            git add choi_threads_monitor/data/research_signals.json choi_threads_monitor/data/research_signals_status.json choi_threads_monitor/data/hf_daily_today.json choi_threads_monitor/data/hf_daily_today.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: refresh Hugging Face Daily Papers"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
