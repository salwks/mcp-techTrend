name: Build Six Hour AI News Intake

on:
  workflow_dispatch:
  push:
    paths:
      - "choi_threads_monitor/build_six_hour_intake.py"
      - ".github/workflows/six-hour-intake.yml"
  schedule:
    # Matches Supabase fixed window boundaries (01:45, 07:45, 13:45, 19:45 KST)
    - cron: "45 4,10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: six-hour-intake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and commit six-hour intake
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 choi_threads_monitor/build_six_hour_intake.py
            git add choi_threads_monitor/data/six_hour_intake.json choi_threads_monitor/data/six_hour_intake.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: build six-hour AI news intake"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
