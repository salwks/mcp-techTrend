<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily AI News</title>
<meta name="description" content="지난 24시간의 AI 뉴스를 매일 아침 전달합니다.">
<style>
:root{--bg:#08111f;--text:#f5f7fb;--muted:#9eacc0;--line:#24334c;--accent:#95b9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#08111f,#0d1830 55%,#101d36);color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(520px,calc(100% - 36px));text-align:center}
h1{margin:0;font-size:clamp(42px,9vw,68px);letter-spacing:-.055em;line-height:1}
h1 span{color:var(--accent)}
p{margin:20px 0 8px;font-size:18px;line-height:1.7;color:#dce4ef}
.limit{margin:0 0 28px;color:var(--muted);font-size:14px}
form{display:grid;gap:12px;text-align:left}
input[type=email]{height:54px;border-radius:14px;border:1px solid var(--line);background:#091321;color:white;font-size:16px;padding:0 15px;outline:none}
button{height:54px;border:0;border-radius:14px;background:#9abaff;color:#07101f;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.5}
.status{min-height:22px;font-size:13px;text-align:center}
.ok{color:#9ce0b8}.err{color:#ffb7b7}.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<h1>Daily <span>AI</span> News</h1>
<p>지난 24시간의 AI 뉴스를 매일 아침 전달합니다.</p>
<div class="limit" id="limit">limit -/300</div>

<form id="subscribe-form">
<label class="hp">Website<input id="website" tabindex="-1" autocomplete="off"></label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
<label class="consent"><input id="consent" type="checkbox" required><span>뉴스레터 수신 및 이메일 주소 저장에 동의합니다.</span></label>
<button id="submit-btn" type="submit">구독하기</button>
<div id="status" class="status" aria-live="polite"></div>
</form>
</main>

<script>
const subscribeEndpoint="https://tiabwoiuohfvtqutulsb.supabase.co/functions/v1/subscribe-daily-ai-news";
const countEndpoint="https://tiabwoiuohfvtqutulsb.supabase.co/functions/v1/daily-ai-news-count";

async function refreshCount(){
  try{
    const r=await fetch(countEndpoint,{cache:"no-store"});
    const d=await r.json();
    if(r.ok && Number.isFinite(d.count)) document.getElementById("limit").textContent="limit "+d.count+"/300";
  }catch(e){}
}
refreshCount();

const form=document.getElementById("subscribe-form"),email=document.getElementById("email"),consent=document.getElementById("consent"),website=document.getElementById("website"),status=document.getElementById("status"),button=document.getElementById("submit-btn");
form.addEventListener("submit",async e=>{
  e.preventDefault();status.className="status";status.textContent="";
  if(!email.validity.valid){status.classList.add("err");status.textContent="이메일 주소를 확인해 주세요.";return}
  if(!consent.checked){status.classList.add("err");status.textContent="수신 동의가 필요합니다.";return}
  button.disabled=true;button.textContent="등록 중...";
  try{
    const r=await fetch(subscribeEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),website:website.value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error)throw new Error();
    status.classList.add("ok");status.textContent="구독되었습니다.";email.value="";consent.checked=false;await refreshCount();
  }catch(err){status.classList.add("err");status.textContent="등록 중 문제가 발생했습니다."}
  finally{button.disabled=false;button.textContent="구독하기"}
});
</script>
</body>
</html>
