<!doctype html>
<html><head><meta charset="utf-8"><title>Core bake</title></head>
<body style="background:#ddd">
<p id="st">baking…</p>
<script type="module">
// 웹 서버(tools/web_export_server.py 8770)에서 http://localhost:8770/__tools/core_bake.html 을 열면
// export_core_frames.js가 frames.json(player 다시 굽기, tiger 그대로)·frames_npc.json(마을 사람 9종)을 seolhwa_godot/data/ 에 다시 쓴다.
import('/__tools/export_core_frames.js').then((m) => m.run((s) => { document.getElementById('st').textContent = s; }))
  .catch((e) => { document.getElementById('st').textContent = 'ERROR ' + e.stack; console.error(e); });
</script>
</body></html>
