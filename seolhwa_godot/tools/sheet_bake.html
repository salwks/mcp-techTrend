<!doctype html>
<html><head><meta charset="utf-8"><title>Sheet bake</title></head>
<body style="background:#ddd">
<p id="st">baking…</p>
<script type="module">
// 확인용 동작 표 — tools/sheet_bake.js 맨 위 설명 참고. 결과: data/_sheets/<name>.png
import('/__tools/sheet_bake.js').then((m) => m.run((s) => { document.getElementById('st').textContent = s; console.log(s); }))
  .catch((e) => { document.getElementById('st').textContent = 'ERROR ' + e.stack; console.error(e); });
</script>
</body></html>
