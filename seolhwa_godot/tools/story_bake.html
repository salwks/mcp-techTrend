<!doctype html>
<html><head><meta charset="utf-8"><title>Story bake</title></head>
<body style="background:#ddd">
<p id="st">baking…</p>
<script type="module">
// 웹 서버(tools/web_export_server.py 8770)에서 http://localhost:8770/__tools/story_bake.html 을 열면
// export_story_frames.js가 구운 결과를 seolhwa_godot/data/ 에 보낸다(frames_story.json + frames_story_<kind>_<n>.png).
// ?set=hanyang → frames_story_hanyang.json(우치·책쾌·포졸).
import('/__tools/export_story_frames.js').then((m) => m.run((s) => { document.getElementById('st').textContent = s; }))
  .catch((e) => { document.getElementById('st').textContent = 'ERROR ' + e.stack; console.error(e); });
</script>
</body></html>
